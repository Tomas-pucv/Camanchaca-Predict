[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camanchaca-predict"
version = "0.1.0"
description = "Estimación de visibilidad en metros bajo camanchaca (Camino La Pólvora, Valparaíso) — G5, Proyecto Aplicado 2026-2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
