name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_OFFLINE: "1"          # los tests nunca descargan pesos (pretrained=False)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias (torch CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,demo]"
      - name: Pruebas
        run: python -m pytest tests -q
      - name: Prueba de humo de punta a punta
        run: camanchaca smoke
